<!doctype html>
<!-- The app serves this in place of a game page while that game downloads or updates (Updater.gate). It is never
     part of the site: when the game is ready it reloads, and the game itself opens at the same address. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Downloading - ThatOneGame</title>
<link rel="stylesheet" href="/assets/site.css">
<style>
  body { margin: 0; background: var(--page); }
  .mstart { background: radial-gradient(circle at 50% 20%, #26324f, var(--page) 75%); }
  /* The same ring as the game list (web/tog.js): the arc's dash offset is 100 - percent; before the first byte a
     quarter arc, and the whole square SVG turns about its centre. */
  .tog-dial { position: relative; width: 84px; height: 84px; margin: 14px auto 8px; }
  .tog-ring { display: block; width: 100%; height: 100%; overflow: visible; }
  .tog-ring circle { fill: none; stroke-width: 3; }
  .tog-ring .tog-t { stroke: rgba(255,255,255,.2); }
  .tog-ring .tog-v { stroke: var(--accent); stroke-dasharray: 100; stroke-dashoffset: 100; transition: stroke-dashoffset .3s linear; }
  .tog-ring.tog-wait { animation: tog-turn 1s linear infinite; transform-origin: center; transform-box: fill-box; }
  .tog-ring.tog-wait .tog-v { stroke-dasharray: 25 75; stroke-dashoffset: 0; transition: none; }
  @keyframes tog-turn { to { transform: rotate(360deg); } }
  .tog-dial span { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: bold 18px Verdana, sans-serif; color: #fff; }
  #msg { min-height: 1.4em; color: #c9d3f2; }
  #retry[hidden], .tog-dial[hidden] { display: none; }
</style>
</head>
<body>
<div class="mstart" id="tog-gate"><div>
  <div class="shot"><img id="thumb" alt="" style="width:100%;height:100%;object-fit:cover"></div>
  <h1 id="title"></h1>
  <div class="tog-dial" id="bar"><svg class="tog-ring tog-wait" viewBox="0 0 36 36" aria-hidden="true"><circle class="tog-t" cx="18" cy="18" r="15.9155"/><circle class="tog-v" cx="18" cy="18" r="15.9155" transform="rotate(-90 18 18)"/></svg><span></span></div>
  <p id="msg">Getting the game ready</p>
  <button class="btn" id="retry" hidden>Try again</button>
</div></div>
<script>
(function () {
  var app = window.TOGApp || (parent !== window && parent.TOGApp);
  var key = (location.pathname.match(/^\/((games|io)\/[^\/]+\/)/) || [])[1];
  var $ = function (id) { return document.getElementById(id); };
  var mb = function (n) { var m = n / 1048576; return m < 1 ? Math.min(1023, Math.max(1, Math.round(n / 1024))) + ' KB' : m.toFixed(m < 10 ? 1 : 0) + ' MB'; }; // under 1 MB in whole KB, never 0
  $('thumb').src = '/' + key + 'thumb.png';
  fetch('/assets/games.json').then(function (r) { return r.json(); }).then(function (d) {
    var g = d.games.filter(function (x) { return x.path === '/' + key; })[0];
    if (g) { $('title').textContent = g.title; document.title = g.title + ' - ThatOneGame'; }
  }).catch(function () {});
  function state() { try { return JSON.parse(app.games())[key] || {}; } catch (e) { return {}; } }
  var started = false;
  function tick() {
    var s = state();
    if (s.s === 'ready') return location.reload();
    if (s.s === 'busy') {
      started = true;
      $('bar').hidden = false;
      var p = s.total ? Math.min(100, Math.floor(s.done * 100 / s.total)) : -1, ring = $('bar').firstChild;
      ring.classList.toggle('tog-wait', p < 0);
      ring.lastChild.style.strokeDashoffset = p < 0 ? '' : 100 - p;
      $('bar').lastChild.textContent = p < 0 ? '' : p + '%';
      $('msg').textContent = (s.installed ? 'Updating' : 'Downloading') + (s.total ? ' · ' + mb(s.done) + ' of ' + mb(s.total) : '');
      return setTimeout(tick, 250);
    }
    if (started && s.error !== undefined) {
      // Offline or the download failed: an installed copy plays as it is; a game never downloaded needs the internet.
      if (s.installed) { app.playInstalled(key); return location.reload(); }
      $('bar').hidden = true;
      $('msg').textContent = 'This game needs the internet the first time it opens. Connect and tap Try again.';
      $('retry').hidden = false;
      started = false;
      return;
    }
    started = true;
    app.install(key);
    setTimeout(tick, 100);
  }
  $('retry').onclick = function () { $('retry').hidden = true; $('msg').textContent = 'Getting the game ready'; tick(); };
  if (app && key) tick();
})();
</script>
</body>
</html>
